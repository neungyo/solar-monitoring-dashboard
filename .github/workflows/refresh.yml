name: Refresh solar dashboard

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: DNS diagnostics
        run: |
          echo "--- getent hosts ---"
          getent hosts sg5.fusionsolar.huawei.com || echo "getent failed"
          echo "--- dig via public resolver 1.1.1.1 ---"
          sudo apt-get install -y dnsutils >/dev/null 2>&1 || true
          dig @1.1.1.1 sg5.fusionsolar.huawei.com || echo "dig failed"
          echo "--- curl -v (8s timeout) ---"
          curl -v --max-time 8 https://sg5.fusionsolar.huawei.com/ 2>&1 | head -50 || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run refresh script
        env:
          FUSIONSOLAR_USER: ${{ secrets.FUSIONSOLAR_USER }}
          FUSIONSOLAR_PASS: ${{ secrets.FUSIONSOLAR_PASS }}
        run: python refresh.py

      - name: Commit and push if changed
        run: |
          git config user.name "solar-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data/
          if ! git diff --cached --quiet; then
            git commit -m "Auto-refresh dashboard data"
            git push
          else
            echo "No changes to commit"
          fi
