name: Refresh solar dashboard

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run refresh script
        env:
          FUSIONSOLAR_USER: ${{ secrets.FUSIONSOLAR_USER }}
          FUSIONSOLAR_PASS: ${{ secrets.FUSIONSOLAR_PASS }}
        run: python refresh.py

      - name: Commit and push if changed
        run: |
          git config user.name "solar-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data/
          if ! git diff --cached --quiet; then
            git commit -m "Auto-refresh dashboard data"
            git push
          else
            echo "No changes to commit"
          fi
